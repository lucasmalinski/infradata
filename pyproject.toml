[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infradata"
version = "0.1.0"
description = "Infrastructure data processing pipeline"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "camelot-py",
]

[tool.setuptools]
packages = ["infradata"]

[tool.setuptools.package-dir]
"" = "src"
