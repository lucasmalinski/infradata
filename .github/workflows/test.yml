name: Run Tests

on:
  push:
    branches: [ entrega-intermediaria-release ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Micromamba
      uses: mambaorg/setup-micromamba@v1
      with:
        environment-file: environment.yml
        environment-name: infradata_env
        init-shell: bash
        cache-environment: true
    
    - name: Run tests
      shell: bash -l {0}
      run: |
        micromamba activate infradata_env
        pytest tests/ -v
